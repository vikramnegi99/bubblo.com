services:
  - type: web
    name: bubblo-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm run migrate && npm run seed && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_FILE
        value: ./data/bubblo.sqlite
      - key: OWNER_EMAIL
        value: mrvickybusines@gmail.com
      - key: EMAIL_PROVIDER
        value: console
      - key: EMAIL_PROVIDER_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: BUBBLO Orders <no-reply@bubblo.store>
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@bubblo.store
      - key: ADMIN_PASSWORD
        sync: false
